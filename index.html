<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
    <title>Movie Management System</title>
</head>
<style>
    .art-name {
        color: white;
        padding-left: 20px;
        padding-right: 20px;
        padding-top: 5px;
        padding-bottom: 5px;
        margin-right: 10px;
        margin-left: 10px;
        border: 1px solid white;
        border-width: 1px;
        white-space: nowrap;
        border-radius: 4px;
    }

    .art-name:active {
        background-color: white;
        color: black;
    }

    #movieDetailsDialog {
        margin: auto;
        border: none;
        padding: 0;
        background: transparent;
    }

    #movieDetailsDialog::backdrop {
        background: rgba(0, 0, 0, 0.7);
    }
</style>

<script>

    window.onload = function () {

        const dialog = document.getElementById("dialog");
        const deleteDialog = document.getElementById("deleteDialog");

        dialog.addEventListener("close", clearForm);
        deleteDialog.addEventListener("close", clearForm);

        if (!localStorage.getItem("movies")) {
            localStorage.setItem("movies",
                JSON.stringify([]));
        }

        displayMovies();
    }

    let imageData = "";
    let editIndex = -1;

    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                imageData = e.target.result;
                const preview =
                    document.getElementById("imagePreview");
                preview.src = imageData;
                preview.classList.remove("hidden");
            };

            reader.readAsDataURL(file);
        }
    }

    function clearForm() {
        document.getElementById("movieName").value = "";
        document.getElementById("category").value = "Action";
        document.getElementById("releaseYear").value = "";
        document.getElementById("rating").value = "";
        document.getElementById("description").value = "";
        document.getElementById("imagePreview").src = "";
        document.getElementById("imagePreview").classList.add("hidden");
        imageData = "";

        editIndex = -1;
    }

    function addMovie() {
        event.preventDefault();

        let movieName =
            document.getElementById("movieName").value;
        movieName = movieName.toUpperCase();

        let category =
            document.getElementById("category").value;

        let releaseYear =
            document.getElementById("releaseYear").value;

        let rating =
            document.getElementById("rating").value;

        let description =
            document.getElementById("description").value;
        if (!movieName || !category || !releaseYear || !rating || !description) {
            alert("Please fill in all fields.");
            return;
        }
        if (rating < 0 || rating > 5) {
            alert("Rating must be between 0 and 5.");
            return;
        }
        if (!imageData) {
            alert("Please upload a movie poster.");
            return;
        }
        if (releaseYear < 1888 || releaseYear >= 2026) {
            alert("Please enter a valid release year.");
            return;
        }
        if (movieName.length > 100) {
            alert("Movie name should be less than 100 characters.");
            return;
        }
        if (description.length > 1000) {
            alert("Description should be less than 1000 characters.");
            return;
        }
        let movie = {
            movieName,
            category,
            releaseYear,
            rating,
            description,
            imageData,
            favorite: false
        };

        let movies = JSON.parse(localStorage.getItem("movies")) || [];

        if (editIndex !== -1) {
            movie.favorite = movies[editIndex].favorite;
            movies[editIndex] = movie;
            editIndex = -1;
        } else {
            movies.push(movie);
        }

        localStorage.setItem("movies", JSON.stringify(movies));

        document.getElementById("dialog").close();

        displayMovies();
        clearForm();
    }

    function editMovie(index) {
        let movies = JSON.parse(localStorage.getItem("movies")) || [];
        let movie = movies[index];

        document.getElementById("movieName").value = movie.movieName;
        document.getElementById("category").value = movie.category;
        document.getElementById("releaseYear").value = movie.releaseYear;
        document.getElementById("rating").value = movie.rating;
        document.getElementById("description").value = movie.description;
        document.getElementById("imagePreview").src = movie.imageData;
        document.getElementById("imagePreview").classList.remove("hidden");
        imageData = movie.imageData;

        editIndex = index;

        document.getElementById('dialog-title').innerText = 'Edit Movie';

        document.getElementById("btn").innerText = "Update Movie";

        const dialog = document.getElementById("dialog");
        dialog.showModal();
    }

    let deleteIndex = -1;

    function openDeleteDialog(index) {
        let movies =
        JSON.parse(localStorage.getItem("movies")) || [];

        deleteIndex = index;

        document.getElementById("deletemsg").innerText =
        `Are you sure you want to delete "${movies[index].movieName}"?`;

        document.getElementById("deleteDialog").showModal();
    }

    function confirmDelete() {
        let movies =
            JSON.parse(localStorage.getItem("movies")) || [];

        movies.splice(deleteIndex, 1);

        localStorage.setItem(
            "movies",
            JSON.stringify(movies)
        );

        displayMovies();

        document.getElementById("deleteDialog").close();
    }

    function movieDetails(index) {

        let movies = JSON.parse(localStorage.getItem("movies")) || [];
        let movie = movies[index];

        let details = `
        <div class="bg-[#081120] border border-[#162033] rounded-2xl p-6 w-[700px] max-w-[95vw]">

            <div class="flex justify-between items-center mb-5">
                <h2 class="text-2xl font-semibold text-white">
                    Movie Details
                </h2>

                <button onclick="document.getElementById('movieDetailsDialog').close()">
                    <img width="22" height="22"
                        src="https://img.icons8.com/material-two-tone/24/FFFFFF/delete-sign.png"
                        alt="close">
                </button>
            </div>

            <div class="flex flex-col md:flex-row gap-5">

                <img src="${movie.imageData}"
                    alt="Movie"
                    class="w-48 h-72 rounded-xl object-cover">

                <div class="flex-1">

                    <h2 class="text-white text-3xl font-bold">
                        ${movie.movieName}
                    </h2>

                    <div class="flex items-center gap-3 mt-3">
                        <span class="text-purple-500 font-medium">
                            ${movie.category.toUpperCase()}
                        </span>

                        <span class="text-gray-400">
                            • ${movie.releaseYear}
                        </span>
                    </div>

                    <div class="flex items-center gap-2 mt-4">
                        <span class="text-white text-xl font-semibold">
                            ${movie.rating}
                        </span>

                        <img width="20" height="20"
                            src="https://img.icons8.com/color/48/filled-star--v1.png"
                            alt="star">
                    </div>

                    <div class="flex gap-3 mt-6">

                        <button class="px-4 py-3 rounded-xl bg-indigo-900 hover:bg-indigo-800">
                            <img width="24" height="24" onclick="editMovie(${index})" command="show-modal" commandfor="dialog"
                                src="https://img.icons8.com/forma-light-sharp/24/FFFFFF/pencil.png"
                                alt="edit">
                        </button>

                        <button onclick="openDeleteDialog(${index})"
                            class="px-4 py-3 rounded-xl bg-red-900 hover:bg-red-800">
                            <img width="24" height="24"
                                src="https://img.icons8.com/glyph-neue/64/FFFFFF/trash.png"
                                alt="delete">
                        </button>

                        <button onclick="toggleFavorite(${index})" 
                            class="flex items-center gap-2 px-4 py-3 rounded-xl border border-gray-700 hover:border-white">

                            <img width="24" height="24"
                                src="${movie.favorite
                                ? 'https://img.icons8.com/sf-ultralight-filled/25/FA5252/like.png'
                                : 'https://img.icons8.com/sf-regular/48/FFFFFF/like.png'}"
                                alt="favorite">

                            <span class="text-white">
                                Add to Favorite
                            </span>
                        </button>
                    </div>
                </div>

            </div>
            <div class="border-b border-gray-800 w-full my-4"></div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-gray-400 mb-2">
                        Release Year
                    </label>
                    <p class="text-gray-300">
                        ${movie.releaseYear}
                    </p>
                </div>

                <div>
                    <label class="block text-gray-400 mb-2">
                        Rating
                    </label>
                    <div class="flex items-center gap-2">
                        <p class="text-gray-300">${movie.rating}</p>
                        <p class="text-gray-300">/ 5</p>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-400 mb-2">
                        Category
                    </label>
                    <p class="text-gray-300">
                        ${movie.category}
                    </p>
                </div>
            </div>    
            
            <div>
                <p class="text-gray-400 mb-2 mt-4">
                    Description
                </p>
                <p class="text-gray-300 mt-2">
                        ${movie.description}
                </p>
            </div>       
        </div>
    `;

        document.getElementById('dialog-title').innerText = 'Add Movie';
        document.getElementById("btn").innerText = "Save Movie";

        const dialog = document.getElementById("movieDetailsDialog");
        dialog.innerHTML = details;
        dialog.showModal();
    }

    function displayMovies(movieList = null) {
        // let movies = JSON.parse(localStorage.getItem("movies")) || [];
        let movies = movieList || JSON.parse(localStorage.getItem("movies")) || [];
        const movieContainer = document.getElementById("movieContainer");
        movieContainer.innerHTML = "";

        if (movies.length === 0) { movieContainer.innerHTML = `
            <div class="col-span-full flex flex-col justify-center items-center py-20">
                <div class="bg-[#292642] p-5 rounded-full">
                    <img width="80" height="80"
                        src="https://img.icons8.com/fluency/48/popcorn.png"
                        alt="popcorn" />
                </div>
                <p class="text-white text-2xl mt-6">
                    No Movies Found
                </p>
                <p class="text-gray-400 mt-3">Add your first movie to get started!</p>

                <button class="bg-purple-900 text-white rounded active:bg-purple-800 my-5 px-4 flex items-center gap-2 py-1"
                    command="show-modal" commandfor="dialog">
                    <p class="font-bold text-2xl mb-1">+</p> Add Movie
                </button>
            </div>
            `;
            return;
        }

        movies.forEach((movie, index) => {
            let movieCard = `
            <div class="bg-[#081120] border border-[#162033] rounded-2xl p-4 flex gap-2 w-full mb-4">
            <img src="${movie.imageData}" alt="Movie" class="w-40 h-55 rounded-xl object-cover cursor-pointer" comamnd="show-modal" commandfor="dialog" onclick="movieDetails(${index})">
            <div class="flex flex-col justify-between flex-1 ml-2">
                <div>
                    <h2 class="text-white text-[22px] font-semibold cursor-pointer" comamnd="show-modal" commandfor="dialog" onclick="movieDetails(${index})">
                        ${movie.movieName}          
                    </h2>
                    <div class="mt-3 flex items-center gap-3">
                        <span class="text-purple-500 font-medium">
                            ${movie.category.toUpperCase()}   
                        </span>
                        <span class="text-gray-400">
                            • ${movie.releaseYear}
                        </span>
                    </div>
                    <div class="flex items-center gap-2 mt-5">
                        <span class="text-white text-xl font-semibold">
                            ${movie.rating}
                        </span>
                        <img width="20" height="20" src="https://img.icons8.com/color/48/filled-star--v1.png"
                            alt="filled-star--v1" />
                    </div>
                </div>
                <div class="flex gap-3 mt-8">
                    <button
                        class="w-13 h-13 rounded-xl bg-indigo-900 hover:bg-indigo-800 flex items-center justify-center text-white text-xl mt-2 cursor-pointer" onclick="editMovie(${index})" command="show-modal" commandfor="dialog">
                        <img width="24" height="24"
                            src="https://img.icons8.com/forma-light-sharp/24/FFFFFF/pencil.png" alt="pencil" />
                    </button>
                    <button command="show-modal" commandfor="deleteDialog" onclick="openDeleteDialog(${index})"
                        class="w-13 h-13 rounded-xl bg-red-900 hover:bg-red-800 flex items-center justify-center text-white text-xl mt-2 cursor-pointer">
                        <img width="24" height="24" src="https://img.icons8.com/glyph-neue/64/FFFFFF/trash.png"
                            alt="trash" />
                    </button>
                    <button onclick="toggleFavorite(${index})"
                        class="w-13 h-13 rounded-xl border border-gray-700 hover:border-white flex items-center justify-center text-white text-xl mt-2">
                        <img width="27" height="27" src="${movie.favorite
                            ? 'https://img.icons8.com/sf-ultralight-filled/25/FA5252/like.png'
                            : 'https://img.icons8.com/sf-regular/48/FFFFFF/like.png'}"
                            alt="like" />
                    </button>
                </div>
            </div>
        `;





            movieContainer.innerHTML += movieCard;
        });
        updateMovieCount();
        updateAverageRating();
        updateFavoriteCount();
    }

    function updateMovieCount() {

        let movies =
            JSON.parse(localStorage.getItem("movies")) || [];

        document.getElementById("totalMovies").innerText =
            movies.length;
    }

    function updateAverageRating() {
        let movies =
            JSON.parse(localStorage.getItem("movies")) || [];

        if (movies.length === 0) {
            document.getElementById("averageRating").innerText = "0";
            return;
        }

        let totalRating = movies.reduce((sum, movie) => sum + parseFloat(movie.rating), 0);
        let averageRating = (totalRating / movies.length).toFixed(1);   



        document.getElementById("averageRating").innerText = averageRating;
    }

    function updateFavoriteCount() {

        let movies =
            JSON.parse(localStorage.getItem("movies")) || [];

        let count = 0;

        movies.forEach(movie => {
            if (movie.favorite) {
                count++;
            }
        });

        document.getElementById("favoriteCount").innerText =
            count;
    }

    function toggleFavorite(index) {
        let movies =
            JSON.parse(localStorage.getItem("movies")) || [];

        movies[index].favorite = !movies[index].favorite;

        localStorage.setItem(
            "movies",
            JSON.stringify(movies)
        );

        displayMovies();

        if (document.getElementById("movieDetailsDialog").open) {
            movieDetails(index);
        }
    }

    function searchMovies() {

        let searchValue = document
            .getElementById("searchMovie")
            .value
            .toLowerCase()
            .trim();

        let movies =
            JSON.parse(localStorage.getItem("movies")) || [];

        let filteredMovies = movies.filter(movie =>
            movie.movieName.toLowerCase().includes(searchValue)
        );

        displayMovies(filteredMovies);
    }

    function filterMovies(category) {

        let movies =
            JSON.parse(localStorage.getItem("movies")) || [];

        if (category === "All") {
            displayMovies();
            return;
        }

        let filteredMovies = movies.filter(movie =>
            movie.category === category
        );

        displayMovies(filteredMovies);
    }

</script>

<body class="bg-[#02020d] px-5 ">
    <section>
        <header>
            <div class="md:flex justify-between">
                <div class="flex items-center h:auto md:h-16 text-white gap-2">
                    <h1 class="text-xl md:text-[32px] font-bold">Movie Management System</h1>
                    <img width="37" height="35" src="https://img.icons8.com/fluency/48/popcorn.png" alt="popcorn" />
                </div>
                <button class="bg-purple-800 text-white rounded active:bg-purple-400 my-4 px-4 flex items-center gap-2 py-1 font-medium"
                    command="show-modal" commandfor="dialog">
                    <p class="font-bold text-2xl mb-1">+</p>Add Movie
                </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

                <div class="bg-[#14141f] rounded-2xl p-6 shadow-lg">
                    <p class="text-gray-400 text-sm mb-3 font-bold">Total Movies</p>
                    <h2 id="totalMovies" class="text-4xl font-bold text-white">0</h2>
                    <p class="text-[#36b163] text-sm mt-3 font-medium">+12 this month</p>
                </div>

                <div class="bg-[#14141f] rounded-2xl p-6 shadow-lg">
                    <p class="text-gray-300 text-sm mb-3">Categories</p>
                    <h2 id="categories" class="text-4xl font-bold text-white">7</h2>
                    <p class="text-gray-300 text-sm mt-3">
                        Action, Comedy, Drama...
                    </p>
                </div>

                <div class="bg-[#14141f] rounded-2xl p-6 shadow-lg">
                    <p class="text-gray-300 text-sm mb-3">Average Rating</p>
                    <div class="flex items-center gap-2">
                        <h2 id="averageRating" class="text-4xl font-bold text-white">0</h2>
                        <img width="40" height="40" src="https://img.icons8.com/color/48/filled-star--v1.png"
                            alt="filled-star--v1" />
                    </div>
                </div>

                <div class="bg-[#14141f] rounded-2xl p-6 shadow-lg">
                    <p class="text-gray-300 text-sm mb-3">Favorites</p>
                    <h2 id="favoriteCount" class="text-4xl font-bold text-white">0</h2>
                    <p class="text-gray-300 text-sm mt-3">
                        Your favorite movies
                    </p>
                </div>
            </div>

            <div class="w-full mt-4 p-2 rounded-lg bg-[#14141f] flex justify-between">
                <input id="searchMovie" type="text" class="text-white px-3 focus:outline-none w-full"
                    placeholder="Search movies..." oninput="searchMovies()">
                <img width="25" height="25" src="https://img.icons8.com/ios-filled/50/FFFFFF/search--v1.png"
                    alt="search--v1" class="mr-1" />
            </div>

            <div class="overflow-auto md:overflow-visible no-scrollbar my-4">
                <div class="flex gap-5 mt-2 w-max md:w-full mr-3 justify-center">
                    <p class="art-name" onclick="filterMovies('All')">All</p>
                    <p class="art-name" onclick="filterMovies('Action')">Action</p>
                    <p class="art-name" onclick="filterMovies('Comedy')">Comedy</p>
                    <p class="art-name" onclick="filterMovies('Drama')">Drama</p>
                    <p class="art-name" onclick="filterMovies('Horror')">Horror</p>
                    <p class="art-name" onclick="filterMovies('Sci-Fi')">Sci-Fi</p>
                    <p class="art-name" onclick="filterMovies('Thriller')">Thriller</p>
                    <p class="art-name" onclick="filterMovies('Animation')">Animation</p>
                </div>
            </div>

            <div id="movieContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-2">
            </div>
        </header>

        <div>
            <dialog id="dialog" aria-labelledby="dialog-title"
                class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent">
                <div
                    class="fixed inset-0 bg-gray-900/50 transition-opacity data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in">
                </div>

                <div tabindex="0"
                    class="flex min-h-full items-end justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0">
                    <div-panel
                        class="relative transform overflow-hidden rounded-lg bg-gray-800 text-left shadow-xl outline -outline-offset-1 outline-white/10 transition-all data-closed:translate-y-4 data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in sm:my-8 sm:w-full sm:max-w-2xl data-closed:sm:translate-y-0 data-closed:sm:scale-95">
                        <div class="bg-gray-800 px-4 pt-3 pb-4 sm:p-5 sm:pb-4">
                            <div class="flex justify-between items-center">
                                <p class="text-xl font-semibold text-white" id="dialog-title">
                                    Add Movie
                                </p>
                                <button type="button" command="close" commandfor="dialog">
                                    <img width="22" height="22"
                                        src="https://img.icons8.com/material-two-tone/24/FFFFFF/delete-sign.png"
                                        alt="close" />
                                </button>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-3">
                                <div class="col-span-1">

                                    <label class="block text-white mb-2 font-medium">
                                        Movie Poster
                                    </label>

                                    <input type="file" id="movieImage" accept="image/*" class="hidden"
                                        onchange="previewImage(event)">

                                    <img id="imagePreview" src=""
                                        class="hidden mt-4 w-full h-auto object-cover rounded-xl border border-gray-700">


                                    <label for="movieImage" class="mt-4 flex flex-col items-center justify-center 
                                            h-32 border-2 border-dashed border-gray-700
                                            rounded-xl cursor-pointer text-gray-400" onchange="previewImage(event)">
                                        <p class="text-lg">Click to upload</p>
                                        <p class="text-sm mt-1"> or drag and drop</p>
                                        <p class="text-xs mt-2">PNG, JPG up to 5MB</p>
                                    </label>
                                </div>

                                <div class="col-span-2 space-y-4">

                                    <div>
                                        <label class="block text-white mb-2">Movie Name *</label>
                                        <input type="text" id="movieName"
                                            class="w-full p-3 bg-[#111827] border border-gray-700 rounded-lg text-white" placeholder="Enter Movie Name">
                                    </div>

                                    <div>
                                        <label class="block text-white mb-2">Category *</label>
                                        <select id="category"
                                            class="w-full p-3 bg-[#111827] border border-gray-700 rounded-lg text-white">
                                            <option>Action</option>
                                            <option>Drama</option>
                                            <option>Comedy</option>
                                            <option>Sci-Fi</option>
                                            <option>Horror</option>
                                            <option>Thriller</option>
                                            <option>Animation</option>
                                        </select>
                                    </div>

                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-white mb-2">Release Year *</label>
                                            <input type="number" id="releaseYear"
                                                class="w-full p-3 bg-[#111827] border border-gray-700 rounded-lg text-white" placeholder="Enter Release Year">
                                        </div>

                                        <div>
                                            <label class="block text-white mb-2">Rating (0-5) *</label>
                                            <input type="number" step="0.1" min="0" max="5" id="rating"
                                                class="w-full p-3 bg-[#111827] border border-gray-700 rounded-lg text-white" placeholder="Enter Rating">
                                        </div>

                                    </div>

                                    <div>
                                        <label class="block text-white mb-2">Description *</label>
                                        <textarea rows="6" id="description"
                                            class="w-full p-3 bg-[#111827] border border-gray-700 rounded-lg text-white" placeholder="Enter Description"></textarea>
                                    </div>

                                </div>
                            </div>
                            <div class="py-3 flex gap-2 justify-end">
                                <button type="button" command="close" commandfor="dialog"
                                    class="mt-3 inline-flex w-full justify-center rounded-md bg-white/10 px-5 py-2 text-sm font-semibold text-white inset-ring inset-ring-white/5 hover:bg-white/20 sm:mt-0 sm:w-auto">Cancel</button>
                                <button type="button" onclick="addMovie()" id="btn"
                                    class="inline-flex w-full justify-center rounded-md bg-purple-800 px-5 py-2 text-sm font-semibold text-white hover:bg-purple-400 sm:ml-3 sm:w-auto">Save Movie</button>
                            </div>
                    </div-panel>
                </div>
            </dialog>
        </div>

        <div>
            <dialog id="deleteDialog" aria-labelledby="dialog-title"
                class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent">
                <div
                    class="fixed inset-0 bg-gray-900/50 transition-opacity data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in">
                </div>

                <div tabindex="0"
                    class="flex min-h-full items-end justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0">
                    <div-panel
                        class="relative transform overflow-hidden rounded-lg bg-gray-800 text-left shadow-xl outline -outline-offset-1 outline-white/10 transition-all data-closed:translate-y-4 data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in h-65 sm:my-8 sm:w-80 sm:max-w-sm data-closed:sm:translate-y-0 data-closed:sm:scale-95">
                        <div class="bg-gray-800 px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                            <div class="sm:flex sm:items-start">

                                <div class="mt-3 text-center">
                                    <div
                                        class="mx-auto flex h-15 w-15 items-center justify-center rounded-full bg-[#503030]">
                                        <img width="50" height="50"
                                            src="https://img.icons8.com/ios/50/FA5252/box-important--v1.png"
                                            alt="box-important--v1" class="mx-auto my-2  w-12 h-12 p-1" />
                                    </div>
                                    <h3 class="text-lg font-medium leading-6 text-white text-center" id="dialog-title">
                                        Delete Movie
                                    </h3>
                                    <div class="mt-2 ">
                                        <p id="deletemsg" class="text-sm text-gray-300 ">Are you sure you want to delete this movie?</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="bg-gray-800 py-3 sm:flex sm:flex-row-reverse sm:justify-center gap-2">
                            <button type="button" command="close" commandfor="deleteDialog"
                                class="mt-3 inline-flex w-full justify-center rounded-md bg-white/10 px-5 py-2 text-sm font-semibold text-white inset-ring inset-ring-white/5 hover:bg-white/20 sm:mt-0 sm:w-auto">Cancel</button>
                            <button type="button" commandfor="deleteDialog" onclick="confirmDelete()"
                                class="inline-flex w-full justify-center rounded-md bg-red-600 px-5 py-2 text-sm font-semibold text-white hover:bg-red-400 sm:ml-3 sm:w-auto"
                                onclick="document.getElementById('deleteDialog').close()">Delete</button>
                        </div>
                    </div-panel>
                </div>
            </dialog>
        </div>

        <dialog id="movieDetailsDialog" class="bg-transparent backdrop:bg-black/70">
        </dialog>

    </section>
</body>

</html>
